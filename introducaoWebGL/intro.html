<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Introdução WebGL</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }

  h1 {
    color: #000000;
    font-size: 2.5rem;
    margin-bottom: 30px;
  }

  .container {
    display: flex;
    gap: 20px;
  }

  .bloco {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  canvas {
    background: #000;
    border: 2px solid #444;
  }

  .legenda {
    width: 300px;
    margin-top: 10px;
    text-align: center;
    color: #000000;
    font-size: 1.1rem;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

  <h1>Introdução WebGL</h1>

  <div class="container">
    <div class="bloco">
      <canvas id="flor" width="300" height="300"></canvas>
      <p class="legenda">Flor</p>
    </div>
    <div class="bloco">
      <canvas id="carro" width="300" height="300"></canvas>
      <p class="legenda">Carro</p>
    </div>
    <div class="bloco">
      <canvas id="robo" width="300" height="300"></canvas>
      <p class="legenda">Robô</p>
    </div>
  </div>

  <script src="flor.js"></script>
  <script src="carro.js"></script>
  <script src="robo.js"></script>

</body>
</html>
